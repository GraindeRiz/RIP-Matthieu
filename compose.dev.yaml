services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    volumes:
      - ./apps/api:/app
      - /app/node_modules

    command: npm run start:dev

    depends_on:
      - postgres
  postgres:
    image: postgres:18-alpine

    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devtest
      POSTGRES_DB: hangboard

    ports:
      - "5432:5432"
    # permet de garder les données localement sur la machine de dev dans docker volume
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: